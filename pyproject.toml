[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signlang"
version = "0.2.0"
description = "Isolated sign-language recognition from MediaPipe landmarks: dataset pipeline, training, ONNX export and live webcam recognition."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Satyanarayana Nikadi" }]
# Exact, tested versions live in requirements.txt (pip install -r requirements.txt).
dependencies = [
    "mediapipe==0.10.9",
    "protobuf>=3.11,<4",
    "opencv-contrib-python>=4.8",
    "numpy>=1.24",
    "torch>=2.1",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["reportlab>=4"]

[project.scripts]
signlang = "signlang.__main__:main"

[tool.setuptools.packages.find]
include = ["signlang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "mediapipe: needs mediapipe==0.10.9 (legacy solutions API); skipped automatically otherwise",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::UserWarning:torch.*",
]
